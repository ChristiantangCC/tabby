name: Release

# Bumping CFBundleShortVersionString in Resources/Info.plist (plus a matching
# "## <version>" section in CHANGELOG.md) publishes a signed release.
on:
  push:
    branches: [main]
    paths: [Resources/Info.plist]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v heading="## ${{ steps.version.outputs.version }}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"; exit 1; }

      - name: Import signing certificate
        if: steps.check.outputs.exists == 'false'
        env:
          CERT_P12: ${{ secrets.TABBY_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TABBY_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build universal app
        if: steps.check.outputs.exists == 'false'
        run: ARCHS="arm64 x86_64" SIGN_ID="Tabby Code Signing (Christian Tang Christensen)" INSTALL=0 ./scripts/build.sh

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/Tabby.app Tabby.zip
          gh release create "v${{ steps.version.outputs.version }}" Tabby.zip \
            --title "Tabby ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
